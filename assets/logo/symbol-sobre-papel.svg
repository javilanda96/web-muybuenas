<g transform="rotate(-5 100 100)">
  <rect x="84" y="26" width="30" height="92" rx="7" fill="#c4551f"/>
  <rect x="82" y="140" width="34" height="34" rx="8" fill="#c4551f"/>
</g>
</svg>
