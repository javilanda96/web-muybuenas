<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="MuyBuenas">
<title>MuyBuenas — símbolo</title>
<!--
  Marca sola (favicon, icono de app, redes sociales). Dibujada a mano en vector,
  sin depender de ninguna fuente — se ve igual en cualquier sitio y pesa menos
  de 1 KB. Es el signo de exclamación de "MuyBuenas!", con un ligero giro que
  le da el carácter "pintado a mano" que se pedía en la dirección de marca:
  no es el trazo geométrico perfecto de un teclado.
-->
<rect width="200" height="200" rx="40" fill="#c4551f"/>
<g transform="rotate(-5 100 100)">
  <rect x="84" y="26" width="30" height="92" rx="7" fill="#fbf8f2"/>
  <rect x="82" y="140" width="34" height="34" rx="8" fill="#fbf8f2"/>
</g>
</svg>
